name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "astral-sh/setup-uv@v6"
      - name: Ruff
        run: uvx ruff@0.14.0 check custom_components tests

  scripts:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: "actions/checkout@v4"
      - uses: "astral-sh/setup-uv@v6"
      - name: On-device scripts
        run: uv run --no-project --python ${{ matrix.python }} --with pytest pytest -q tests/scripts

  integration:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "astral-sh/setup-uv@v6"
      - name: Integration
        run: >-
          uv run --no-project --python 3.14
          --with pytest-homeassistant-custom-component==0.13.373 --with asyncssh
          --with unifi-discovery==1.5.0
          pytest -q tests --ignore=tests/scripts
          --cov=custom_components/unifi_unas --cov-fail-under=95
